version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bank-db-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=bankdb
    volumes:
      - ./pg-data:/var/lib/postgresql/data